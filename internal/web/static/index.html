<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>digestron</title>
<style>
  :root {
    --bg: #08090d; --bg2: #0c0e15;
    --surface: rgba(255,255,255,.045); --surface-hover: rgba(255,255,255,.075);
    --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.16);
    --text: #e9ebf1; --muted: #8b93a5; --muted-2: #5c6478;
    --accent1: #6366f1; --accent2: #22d3ee;
    --info: #3b82f6; --warning: #f59e0b; --critical: #f43f5e; --ok: #10b981;
    --radius: 14px; --radius-sm: 9px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, ui-sans-serif, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(99,102,241,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.10), transparent 55%),
      var(--bg);
    color: var(--text); font: 14px/1.5 var(--sans); min-height: 100vh;
  }
  ::selection { background: rgba(99,102,241,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: rgba(8,9,13,.72); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: .6rem; }
  .brand h1 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(120deg, #fff, #aab0c6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .tag { font-size: .72rem; color: var(--muted-2); font-family: var(--mono); }
  .status { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .8rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); }
    70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  .app { display: grid; grid-template-columns: 400px 1fr; gap: 1.25rem; padding: 1.25rem 1.5rem 2rem; align-items: start; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 960px) { .app { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  .sidebar-head { padding: 1rem 1.1rem .9rem; border-bottom: 1px solid var(--border); }
  .sidebar-head .totals { display: flex; align-items: baseline; justify-content: space-between; }
  .sidebar-head .count { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  .sidebar-head .count small { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: .35rem; }
  .sidebar-head .tokens { font-family: var(--mono); font-size: .78rem; color: var(--muted); text-align: right; }
  .sidebar-head svg.spark { display: block; margin-top: .6rem; width: 100%; height: 28px; }

  .run-list { max-height: calc(100vh - 220px); overflow-y: auto; padding: .6rem; display: flex; flex-direction: column; gap: .45rem; }
  @media (max-width: 960px) { .run-list { max-height: 46vh; } }

  .run-card {
    position: relative; cursor: pointer; padding: .7rem .8rem .7rem 1rem; border-radius: var(--radius-sm);
    border: 1px solid transparent; background: rgba(255,255,255,.02);
    display: grid; gap: .3rem; transition: background .15s ease, transform .15s ease, border-color .15s ease;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .run-card::before {
    content: ""; position: absolute; left: 0; top: .35rem; bottom: .35rem; width: 3px; border-radius: 3px;
    background: var(--sev); opacity: .8;
  }
  .run-card:hover { background: var(--surface-hover); transform: translateX(1px); }
  .run-card.selected { background: rgba(99,102,241,.10); border-color: rgba(99,102,241,.35); }
  .run-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .run-card time { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .run-card .summary { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .run-card .meta { display: flex; gap: .6rem; font-size: .72rem; color: var(--muted-2); font-family: var(--mono); }
  .run-card .meta .bad { color: var(--critical); }

  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .55rem; border-radius: 999px; font-size: .7rem; font-weight: 600; letter-spacing: .01em; text-transform: uppercase; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.info { color: var(--info); background: rgba(59,130,246,.14); }
  .pill.warning { color: var(--warning); background: rgba(245,158,11,.14); }
  .pill.critical { color: var(--critical); background: rgba(244,63,94,.14); }
  .pill.ok { color: var(--ok); background: rgba(16,185,129,.14); }

  .detail { position: sticky; top: 5.2rem; padding: 1.4rem 1.5rem 1.6rem; min-height: 300px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; padding: 4rem 1rem; color: var(--muted-2); text-align: center; }
  .empty svg { opacity: .5; }

  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .detail-head h2 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  .detail-head time { display: block; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-top: .25rem; }

  .summary-box {
    background: linear-gradient(180deg, rgba(99,102,241,.08), rgba(34,211,238,.04));
    border: 1px solid var(--border); border-left: 3px solid var(--accent1);
    border-radius: var(--radius-sm); padding: .9rem 1.05rem; white-space: pre-wrap; font-size: .88rem; color: #d7dae4;
    margin-bottom: 1.4rem;
  }

  h3.section { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .6rem; font-weight: 600; }

  table.findings { border-collapse: collapse; width: 100%; margin-bottom: 1.4rem; }
  table.findings th { text-align: left; font-size: .72rem; font-weight: 500; color: var(--muted-2); padding: 0 .6rem .4rem; }
  table.findings td { padding: .5rem .6rem; border-top: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
  table.findings tr:hover td { background: rgba(255,255,255,.02); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  .chip { font-family: var(--mono); font-size: .7rem; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 6px; padding: .05rem .4rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; margin-bottom: 1.4rem; }
  .stat-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .6rem .7rem; background: rgba(255,255,255,.02); }
  .stat-card .name { font-size: .8rem; font-weight: 600; margin-bottom: .3rem; display: flex; align-items: center; gap: .4rem; }
  .stat-card .icon { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .stat-card .icon.ok { background: var(--ok); box-shadow: 0 0 8px rgba(16,185,129,.6); }
  .stat-card .icon.fail { background: var(--critical); box-shadow: 0 0 8px rgba(244,63,94,.6); }
  .stat-card .sub { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .stat-card .err { font-size: .72rem; color: var(--critical); margin-top: .25rem; word-break: break-word; }

  .llm-bar { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .llm-bar .item { flex: 1 1 120px; padding: .65rem .85rem; border-right: 1px solid var(--border); }
  .llm-bar .item:last-child { border-right: none; }
  .llm-bar .item .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); margin-bottom: .2rem; }
  .llm-bar .item .v { font-family: var(--mono); font-size: .85rem; }
  .llm-bar .item .v.fail { color: var(--critical); }
  .llm-bar .item .v.disabled { color: var(--muted-2); }

  .actions { display: flex; align-items: center; gap: .9rem; }
  .flash { font-family: var(--mono); font-size: .74rem; color: var(--warning); }
  .check { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--muted); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent1); margin: 0; }
  .btn {
    font: 600 .8rem/1 var(--sans); color: #fff; cursor: pointer; border: none; border-radius: 999px;
    padding: .55rem 1rem; background: linear-gradient(120deg, var(--accent1), var(--accent2));
    box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset; transition: opacity .15s ease, transform .15s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .55; cursor: progress; font-family: var(--mono); font-weight: 500; }

  .logs-panel { max-width: 1400px; margin: 0 auto 2rem; padding: 0 1.5rem; }
  .logs-panel .panel { overflow: hidden; }
  .logs-head { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .8rem 1.1rem; border-bottom: 1px solid var(--border); }
  .logs-head h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
  .seg button { font: 600 .7rem/1 var(--mono); text-transform: uppercase; background: transparent; color: var(--muted); border: 0; padding: .45rem .75rem; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: rgba(99,102,241,.24); color: #fff; }
  .logs-head input[type=search], .logs-head select {
    font: .78rem var(--mono); color: var(--text); background: rgba(255,255,255,.04);
    border: 1px solid var(--border); border-radius: 999px; padding: .4rem .8rem; outline: none;
  }
  .logs-head input[type=search] { min-width: 12rem; }
  .logs-head input[type=search]:focus, .logs-head select:focus { border-color: rgba(99,102,241,.6); }
  .logs-head select option { background: #12141c; }
  .runtag { font: .74rem var(--mono); color: var(--accent2); background: rgba(34,211,238,.10); border: 1px solid rgba(34,211,238,.28); border-radius: 999px; padding: .28rem .35rem .28rem .7rem; }
  .runtag button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 .35rem; }
  .logs-note { padding: .45rem 1.1rem; color: var(--warning); font: .75rem var(--mono); border-bottom: 1px solid var(--border); }
  .logs-body { font: 12px/1.6 var(--mono); max-height: 46vh; overflow: auto; padding: .4rem 0; }
  .log-row { display: grid; grid-template-columns: 6.4rem 3.4rem 1fr; gap: .7rem; padding: .05rem 1.1rem; }
  .log-row:hover { background: var(--surface-hover); }
  .log-row .t { color: var(--muted-2); }
  .log-row .lv { font-weight: 700; }
  .lv-DEBUG { color: var(--muted-2); } .lv-INFO { color: var(--info); } .lv-WARN { color: var(--warning); } .lv-ERROR { color: var(--critical); }
  .log-row .msg { word-break: break-word; }
  .log-row .attrs { color: var(--muted); word-break: break-word; }
  .log-row .attrs b { color: var(--muted-2); font-weight: 500; }
  .log-row a.rtag, .logs-link { color: var(--accent2); cursor: pointer; text-decoration: none; }
  .log-row a.rtag { margin-left: .5rem; font-size: .72rem; }
  .logs-link:hover, .log-row a.rtag:hover { text-decoration: underline; }
  .logs-empty { padding: 2rem 1.1rem; text-align: center; color: var(--muted-2); font-family: var(--sans); }

  @media (prefers-reduced-motion: reduce) {
    .dot, .run-card { animation: none !important; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>digestron</h1>
    <span class="tag">run history</span>
  </div>
  <div class="actions">
    <span class="flash" id="flash"></span>
    <label class="check" title="query every source and the LLM, skip the sinks: nothing is sent">
      <input type="checkbox" id="dry" checked> dry run
    </label>
    <button class="btn" id="run-btn" type="button">Run now</button>
    <div class="status"><span class="dot"></span><span id="live-text">live</span></div>
  </div>
</header>

<main class="app">
  <section class="panel">
    <div class="sidebar-head">
      <div class="totals">
        <div class="count" id="run-count">0<small>runs kept</small></div>
        <div class="tokens" id="token-total">0 tokens</div>
      </div>
      <svg class="spark" id="spark" viewBox="0 0 100 28" preserveAspectRatio="none"></svg>
    </div>
    <div id="runs" class="run-list"></div>
  </section>

  <section class="panel detail" id="detail">
    <div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M4 5h16M4 12h16M4 19h10" stroke-linecap="round"/>
      </svg>
      <div>select a run to inspect its digest</div>
    </div>
  </section>
</main>

<section class="logs-panel" aria-label="process log">
  <div class="panel">
    <div class="logs-head">
      <h2>process log</h2>
      <div class="seg" id="log-levels" role="group" aria-label="lowest level shown">
        <button type="button" data-level="debug">debug</button>
        <button type="button" data-level="info" class="on">info</button>
        <button type="button" data-level="warn">warn</button>
        <button type="button" data-level="error">error</button>
      </div>
      <input type="search" id="log-q" placeholder="filter text" aria-label="filter log text" autocomplete="off" spellcheck="false">
      <span class="runtag" id="log-run" hidden></span>
      <label class="check"><input type="checkbox" id="log-follow" checked> follow</label>
      <label class="check" title="what kubectl logs prints. The page always keeps every level.">stderr
        <select id="log-stderr" aria-label="level printed on stderr">
          <option>debug</option><option>info</option><option>warn</option><option>error</option>
        </select>
      </label>
    </div>
    <div class="logs-note" id="log-note" hidden></div>
    <div class="logs-body" id="log-body"></div>
  </div>
</section>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sevColor = v => ({info: "var(--info)", warning: "var(--warning)", critical: "var(--critical)"}[v] || "var(--ok)");
const pill = v => `<span class="pill ${esc(v)}">${esc(v)}</span>`;
const ms = n => n >= 1000 ? (n / 1000).toFixed(1) + "s" : Math.round(n) + "ms";
const nsToMs = n => Math.round((n || 0) / 1e6);
const fmtTime = d => new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
let selected = null;
let lastRuns = [];

function sparkline(points) {
  if (points.length < 2) return "";
  const max = Math.max(...points, 1);
  const min = Math.min(...points, 0);
  const span = Math.max(max - min, 1);
  const step = 100 / (points.length - 1);
  const coords = points.map((p, i) => `${(i * step).toFixed(1)},${(26 - ((p - min) / span) * 24).toFixed(1)}`);
  const line = coords.join(" ");
  const area = `0,28 ${line} 100,28`;
  return `
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderCard(r) {
  const model = r.model ? `<span>${esc(r.model)}</span>` : "";
  const tok = (r.prompt_tokens || r.completion_tokens) ? `<span>${r.prompt_tokens || 0}/${r.completion_tokens || 0}tok</span>` : "";
  const fails = [];
  if (r.sources_failed) fails.push(`<span class="bad">${r.sources_failed} src fail</span>`);
  if (r.sinks_failed) fails.push(`<span class="bad">${r.sinks_failed} sink fail</span>`);
  return `
    <div class="run-card ${r.id === selected ? "selected" : ""}" style="--sev:${sevColor(r.verdict)}" data-id="${esc(r.id)}">
      <div class="row1">${pill(r.verdict)}<time>${fmtTime(r.generated_at)}</time></div>
      <div class="summary">${esc((r.summary || "no summary").slice(0, 140))}</div>
      <div class="meta">${model}${tok}<span>${r.findings} findings</span>${fails.join("")}<a class="logs-link" data-run="${esc(r.id)}" title="show only this run's log lines">logs</a></div>
    </div>`;
}

async function refresh() {
  const runs = await (await fetch("api/runs")).json();
  lastRuns = runs;

  document.getElementById("runs").innerHTML =
    runs.map(renderCard).join("") ||
    `<div class="empty"><div>no runs yet — waiting for the first digest</div></div>`;

  document.getElementById("run-count").innerHTML = `${runs.length}<small>runs kept</small>`;
  const tokens = runs.reduce((a, r) => a + (r.prompt_tokens || 0) + (r.completion_tokens || 0), 0);
  document.getElementById("token-total").textContent = `${tokens.toLocaleString()} tokens`;

  const series = [...runs].reverse().map(r => (r.prompt_tokens || 0) + (r.completion_tokens || 0));
  document.getElementById("spark").innerHTML = sparkline(series);

  document.querySelectorAll(".run-card[data-id]").forEach(el =>
    el.addEventListener("click", () => show(el.dataset.id)));
  document.querySelectorAll(".logs-link[data-run]").forEach(el =>
    el.addEventListener("click", ev => { ev.stopPropagation(); setLogRun(el.dataset.run, true); }));
}

async function show(id) {
  selected = id;
  document.querySelectorAll(".run-card[data-id]").forEach(el =>
    el.classList.toggle("selected", el.dataset.id === id));

  const resp = await fetch("api/runs/" + encodeURIComponent(id));
  if (!resp.ok) return;
  const { report: r } = await resp.json();

  const findingsRows = (r.findings || []).map(f => `
    <tr>
      <td>${pill(f.severity)}</td>
      <td class="mono" style="color:var(--muted)">${esc(f.source)}</td>
      <td>${esc(f.title)}</td>
      <td>${f.count}</td>
      <td><div class="chips">${Object.entries(f.details || {}).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `<span class="chip">${esc(k)}=${v}</span>`).join("") || "—"}</div></td>
    </tr>`).join("") || `<tr><td colspan="5" style="color:var(--muted-2)">none</td></tr>`;

  const sourceCards = (r.stats || []).map(s => `
    <div class="stat-card">
      <div class="name"><span class="icon ${s.error ? "fail" : "ok"}"></span>${esc(s.source)}</div>
      <div class="sub">${s.findings ?? 0} findings · ${ms(nsToMs(s.duration))}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("") || `<div style="color:var(--muted-2);font-size:.8rem">none</div>`;

  const sinkCards = (r.sinks || []).map(s => `
    <div class="stat-card">
      <div class="name"><span class="icon ${s.error ? "fail" : "ok"}"></span>${esc(s.sink)}</div>
      <div class="sub">${ms(nsToMs(s.duration))}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("") || `<div style="color:var(--muted-2);font-size:.8rem">none</div>`;

  const l = r.llm || {};
  const llmBar = l.provider ? `
    <div class="item"><div class="k">provider</div><div class="v">${esc(l.provider)}</div></div>
    <div class="item"><div class="k">model</div><div class="v">${esc(l.model || "—")}</div></div>
    <div class="item"><div class="k">prompt tok</div><div class="v">${l.prompt_tokens || 0}</div></div>
    <div class="item"><div class="k">completion tok</div><div class="v">${l.completion_tokens || 0}</div></div>
    <div class="item"><div class="k">duration</div><div class="v">${ms(nsToMs(l.duration))}</div></div>
    <div class="item"><div class="k">status</div><div class="v ${l.error ? "fail" : ""}">${esc(l.error || "ok")}</div></div>`
    : `<div class="item"><div class="k">llm</div><div class="v disabled">disabled for this run</div></div>`;

  document.getElementById("detail").innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${esc(r.title)}</h2>
        <time>${fmtTime(r.generated_at)}</time>
      </div>
      ${pill(r.verdict)}
    </div>
    <div class="summary-box">${esc(r.summary || "(no LLM summary — raw digest was delivered)")}</div>

    <h3 class="section">findings received</h3>
    <table class="findings">
      <thead><tr><th>severity</th><th>source</th><th>finding</th><th>count</th><th>breakdown</th></tr></thead>
      <tbody>${findingsRows}</tbody>
    </table>

    <h3 class="section">sources</h3>
    <div class="stat-grid">${sourceCards}</div>

    <h3 class="section">sinks sent</h3>
    <div class="stat-grid">${sinkCards}</div>

    <h3 class="section">llm</h3>
    <div class="llm-bar">${llmBar}</div>
  `;
}

// Run now. The request returns at once; the run itself can take minutes, so
// the page follows it through api/run until it ends, then reloads the list.
const runBtn = document.getElementById("run-btn");
const dryBox = document.getElementById("dry");
const flashEl = document.getElementById("flash");
let watching = false;

function flash(msg) {
  flashEl.textContent = msg;
  if (msg) setTimeout(() => { if (flashEl.textContent === msg) flashEl.textContent = ""; }, 6000);
}

function renderStatus(s) {
  runBtn.disabled = !!s.running;
  if (s.running) {
    const secs = Math.max(0, Math.round((Date.now() - new Date(s.started_at)) / 1000));
    runBtn.textContent = `running${s.dry ? " (dry)" : ""} · ${secs}s`;
    document.getElementById("live-text").textContent = "run in progress";
  } else {
    runBtn.textContent = "Run now";
    document.getElementById("live-text").textContent = "live";
  }
}

async function watchRun() {
  if (watching) return;
  watching = true;
  let fails = 0;
  try {
    for (;;) {
      let s;
      try {
        s = await (await fetch("api/run")).json();
      } catch (e) {
        // A 502 while the pod rolls, a laptop waking up: one failed poll is
        // not the end of the run, so keep going before giving up.
        if (++fails > 5) { renderStatus({ running: false }); flash("status unavailable"); return; }
        await new Promise(r => setTimeout(r, 2000));
        continue;
      }
      fails = 0;
      renderStatus(s);
      if (!s.running) break;
      await new Promise(r => setTimeout(r, 2000));
    }
  } finally {
    watching = false; // released before the reload: a click during it must start its own watch
  }
  refresh();
}

runBtn.addEventListener("click", async () => {
  runBtn.disabled = true;
  try {
    const resp = await fetch("api/run?dry=" + (dryBox.checked ? "1" : "0"), { method: "POST" });
    if (resp.status === 409) flash("a run is already in progress");
    else if (!resp.ok) flash(`run refused: ${resp.status}`);
  } catch (e) {
    flash("server unreachable");
  }
  watchRun();
});

// Process log. The server keeps every level in a ring; the page asks for
// what it wants to see and follows a cursor, so a poll costs one small
// request. Changing a filter starts a new read from the top: the generation
// counter drops any response that was still in flight for the old filter.
const LOG_CAP = 2000;
const logs = {
  level: "info", q: "", run: "", since: 0, rows: [], follow: true,
  gen: 0,        // bumped by every filter change: a response for an older one is dropped
  inflight: -1,  // the gen of the fetch in flight, -1 when none: never two with the same cursor
  boot: "",      // the ring's id; it changes when the process restarts
  painted: false, lost: 0, restarted: false, err: false,
};
const logBody = document.getElementById("log-body");
const logNote = document.getElementById("log-note");
const logFollow = document.getElementById("log-follow");
const logStderr = document.getElementById("log-stderr");

function logNoteText(msg) { logNote.hidden = !msg; logNote.textContent = msg || ""; }

// The note stays until the filters change: it reports something that already
// happened (lines evicted, a restart), and a poll that comes back clean must
// not wipe it two seconds later.
function updateLogNote() {
  const parts = [];
  if (logs.err) parts.push("log unavailable, retrying");
  if (logs.restarted) parts.push("the process restarted: showing its log from the start");
  if (logs.lost) parts.push(`${logs.lost} lines were evicted before they could be read`);
  logNoteText(parts.join(" · "));
}

function fmtLogTime(t) {
  const d = new Date(t), p = (n, w = 2) => String(n).padStart(w, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;
}

// A run ID is its start instant in UTC; show it in the same local time as the
// lines beside it, or the tag and the timestamps disagree by the UTC offset.
function runLabel(id) {
  const d = new Date(id);
  if (isNaN(d)) return String(id).slice(11, 19);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function renderLogRow(r) {
  const attrs = Object.entries(r.attrs || {}).map(([k, v]) => `<b>${esc(k)}</b>=${esc(v)}`).join(" ");
  const tag = (r.run && !logs.run)
    ? `<a class="rtag" data-run="${esc(r.run)}" title="only this run">${esc(runLabel(r.run))}</a>` : "";
  return `<div class="log-row"><span class="t">${fmtLogTime(r.t)}</span>` +
    `<span class="lv lv-${esc(r.level)}">${esc(r.level.slice(0, 5))}</span>` +
    `<span><span class="msg">${esc(r.msg)}</span>${tag}<span class="attrs"> ${attrs}</span></span></div>`;
}

// Full paint: after a filter change or a restart, and for the first page, which
// decides between rows and the empty-state message.
function paintLogs() {
  const empty = logs.run
    ? "no lines retained for this run: the log lives in memory and starts empty when the process restarts"
    : "no log lines match";
  logBody.innerHTML = logs.rows.map(renderLogRow).join("") || `<div class="logs-empty">${esc(empty)}</div>`;
  logs.painted = true;
  if (logs.follow) logBody.scrollTop = logBody.scrollHeight;
}

// Append only what is new. Rebuilding the whole list on every poll drops a text
// selection the operator is copying from, and once the list is capped it slides
// the lines being read upward by however many were trimmed.
function appendLogs(records) {
  const last = logs.rows.length ? logs.rows[logs.rows.length - 1].seq : 0;
  const fresh = records.filter(r => r.seq > last); // a page that arrives twice adds nothing
  if (!logs.painted) { logs.rows = fresh.slice(-LOG_CAP); paintLogs(); return; }
  if (!fresh.length) return;
  logs.rows = logs.rows.concat(fresh).slice(-LOG_CAP);
  const empty = logBody.querySelector(".logs-empty");
  if (empty) empty.remove();
  logBody.insertAdjacentHTML("beforeend", fresh.map(renderLogRow).join(""));
  let trimmed = 0;
  while (logBody.children.length > LOG_CAP) {
    trimmed += logBody.firstElementChild.offsetHeight;
    logBody.firstElementChild.remove();
  }
  if (logs.follow) logBody.scrollTop = logBody.scrollHeight;
  else if (trimmed) logBody.scrollTop = Math.max(0, logBody.scrollTop - trimmed);
}

function logQuery() {
  const p = new URLSearchParams({ level: logs.level, limit: "500" });
  if (logs.since) p.set("since", logs.since);
  if (logs.q) p.set("q", logs.q);
  if (logs.run) p.set("run", logs.run);
  return "api/logs?" + p;
}

async function pollLogs() {
  if (logs.inflight === logs.gen || document.hidden) return;
  const gen = logs.gen;
  logs.inflight = gen;
  let more = false;
  try {
    const resp = await fetch(logQuery());
    if (!resp.ok) throw new Error("status " + resp.status);
    const page = await resp.json();
    if (gen !== logs.gen) return; // the filters changed while this was in flight
    if (logs.boot && page.boot !== logs.boot) {
      // The process restarted: its ring numbers from 1 again, so the cursor
      // held here means nothing. Adopting the new, smaller one would skip the
      // new process's first lines, the ones that explain the restart.
      logs.boot = page.boot;
      logs.since = 0; logs.rows = []; logs.lost = 0; logs.restarted = true;
      logs.painted = false;
      logBody.innerHTML = "";
      more = true;
    } else {
      logs.boot = page.boot;
      logs.since = page.seq;
      logs.lost += page.dropped || 0;
      appendLogs(page.records);
      more = page.records.length >= 500; // a full page: there is more waiting
    }
    logs.err = false;
    if (document.activeElement !== logStderr) logStderr.value = page.level;
  } catch (e) {
    logs.err = true;
  } finally {
    if (logs.inflight === gen) logs.inflight = -1; // a stale poll must not release a newer one's slot
    updateLogNote();
  }
  if (more) pollLogs();
}

function resetLogs() {
  logs.gen++;
  logs.since = 0;
  logs.rows = [];
  logs.painted = false;
  logs.lost = 0;
  logs.restarted = false;
  logBody.innerHTML = "";
  updateLogNote();
  pollLogs();
}

function setLogLevel(level) {
  logs.level = level;
  document.querySelectorAll("#log-levels button").forEach(b => b.classList.toggle("on", b.dataset.level === level));
}

function setLogRun(id, reveal) {
  logs.run = id || "";
  const chip = document.getElementById("log-run");
  chip.hidden = !logs.run;
  chip.innerHTML = logs.run
    ? `run ${esc(runLabel(logs.run))}<button type="button" title="show every run" aria-label="clear run filter">✕</button>` : "";
  if (logs.run) setLogLevel("debug"); // a run's own lines, all of them
  resetLogs();
  if (reveal) document.getElementById("log-body").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.querySelectorAll("#log-levels button").forEach(b =>
  b.addEventListener("click", () => { setLogLevel(b.dataset.level); resetLogs(); }));
let logTyping;
document.getElementById("log-q").addEventListener("input", ev => {
  clearTimeout(logTyping);
  logTyping = setTimeout(() => { logs.q = ev.target.value.trim(); resetLogs(); }, 250);
});
document.getElementById("log-run").addEventListener("click", ev => { if (ev.target.closest("button")) setLogRun(""); });
logBody.addEventListener("click", ev => {
  const tag = ev.target.closest("a.rtag");
  if (tag) setLogRun(tag.dataset.run);
});
logFollow.addEventListener("change", () => {
  logs.follow = logFollow.checked;
  if (logs.follow) logBody.scrollTop = logBody.scrollHeight;
});
logBody.addEventListener("scroll", () => { // scrolling up means "stop following"
  if (logs.follow && logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight > 40) {
    logs.follow = false;
    logFollow.checked = false;
  }
});
logStderr.addEventListener("change", async () => {
  try {
    const resp = await fetch("api/logs/level", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ level: logStderr.value }),
    });
    if (!resp.ok) throw new Error("status " + resp.status);
    flash("stderr level: " + logStderr.value);
  } catch (e) {
    flash("could not change the stderr level");
  }
  pollLogs();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollLogs(); });

resetLogs();
const logTimer = setInterval(pollLogs, 2000);

refresh();
watchRun(); // the page may open while the hourly run is in flight
setInterval(refresh, 30000);
</script>
</body>
</html>
