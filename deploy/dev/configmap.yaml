apiVersion: v1
kind: ConfigMap
metadata:
  name: digestron-config
data:
  config.yaml: |
    digest:
      title: "Security digest [dev]"
      window: 1h
      language: fr
      # top IP investiguees (facettes ES + rDNS/RDAP) et analysees par le LLM
      top_actors: 5
      context: >
        Homelab k3s deux noeuds expose sur Internet via un edge nginx sur un
        Raspberry Pi : Home Assistant, Immich, Vaultwarden, ArgoCD, Grafana.
        fail2ban protege l'edge, UFW le serveur principal.

    schedule:
      cron: "5 * * * *"
      timezone: "Europe/Paris"

    metrics:
      listen: ":9090"

    history:
      path: /data/history.json
      keep: 200

    sources:
      - name: es-security
        type: elasticsearch
        settings:
          url: http://elasticsearch.elasticsearch.svc.cluster.local:9200
          index: "filebeat-*"
          username: elastic
          password: ${ES_PASSWORD}
          # Un severity remplace les deux seuils du preset : toujours donner
          # warning ET critical.
          queries:
            # Un ban est une defense reussie : avertir sur une vague, pas sur
            # un ban isole. Provisoire, a recaler sur 7 jours une fois les logs
            # du Pi revenus dans ES.
            - preset: fail2ban
              severity: { warning: 10, critical: 50 }
            - preset: ssh_auth
            - preset: app_login_failures
            # Rejeu horaire du preset (fenetres :05-:05). 7 jours au 10/10 :
            # mediane 637, p99 885, max 916, donc 0 warning. 60 jours : max
            # 1046 hors incident, 1809 le 14/08 (reseau du nouveau noeud),
            # donc 0 critical. Depuis la regle UFW 192.168.6.2 -> :5000
            # (10/10), environ 430/h.
            - preset: ufw_blocks
              severity: { warning: 1300, critical: 2000 }
            - preset: nginx_public

    llm:
      type: ollama
      timeout: 300s
      settings:
        url: http://192.168.0.156:9401
        model: qwen3.5:9b
        num_ctx: 16384
        keep_alive: -1m

    sinks:
      - name: phone
        type: homeassistant
        settings:
          url: http://home-assistant.home-assistant.svc.cluster.local:8123
          token: ${HA_TOKEN}
          service: mobile_app_iphone
          # notif courte (titre + une ligne par IP), le tap ouvre le rapport complet
          link: http://digestron-dev.home/
          max_chars: 450
