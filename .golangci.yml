version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - bodyclose
    - gosec
    - revive
    - misspell
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
