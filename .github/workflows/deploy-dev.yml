name: deploy-dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "deploy/dev/deployment.yaml"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - id: tag
        run: echo "sha=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.sha }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}

      - name: bump dev manifest
        run: |
          sed -i "s|ghcr.io/${{ github.repository }}:dev.*|ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}|" deploy/dev/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/dev/deployment.yaml
          git commit -m "deploy: ${{ steps.tag.outputs.sha }} [skip ci]"
          git push origin HEAD:dev
