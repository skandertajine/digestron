<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>digestron</title>
<style>
  :root {
    --bg: #08090d; --bg2: #0c0e15;
    --surface: rgba(255,255,255,.045); --surface-hover: rgba(255,255,255,.075);
    --border: rgba(255,255,255,.09); --border-strong: rgba(255,255,255,.16);
    --text: #e9ebf1; --muted: #8b93a5; --muted-2: #5c6478;
    --accent1: #6366f1; --accent2: #22d3ee;
    --info: #3b82f6; --warning: #f59e0b; --critical: #f43f5e; --ok: #10b981;
    --radius: 14px; --radius-sm: 9px;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, ui-sans-serif, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    background:
      radial-gradient(1100px 500px at 15% -10%, rgba(99,102,241,.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.10), transparent 55%),
      var(--bg);
    color: var(--text); font: 14px/1.5 var(--sans); min-height: 100vh;
  }
  ::selection { background: rgba(99,102,241,.35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    background: rgba(8,9,13,.72); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: .6rem; }
  .brand h1 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(120deg, #fff, #aab0c6);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .tag { font-size: .72rem; color: var(--muted-2); font-family: var(--mono); }
  .status { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .8rem; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(16,185,129,.6); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); }
    70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  .app { display: grid; grid-template-columns: 400px 1fr; gap: 1.25rem; padding: 1.25rem 1.5rem 2rem; align-items: start; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 960px) { .app { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }

  .sidebar-head { padding: 1rem 1.1rem .9rem; border-bottom: 1px solid var(--border); }
  .sidebar-head .totals { display: flex; align-items: baseline; justify-content: space-between; }
  .sidebar-head .count { font-size: 1.4rem; font-weight: 700; letter-spacing: -.02em; }
  .sidebar-head .count small { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: .35rem; }
  .sidebar-head .tokens { font-family: var(--mono); font-size: .78rem; color: var(--muted); text-align: right; }
  .sidebar-head svg.spark { display: block; margin-top: .6rem; width: 100%; height: 28px; }

  .run-list { max-height: calc(100vh - 220px); overflow-y: auto; padding: .6rem; display: flex; flex-direction: column; gap: .45rem; }
  @media (max-width: 960px) { .run-list { max-height: 46vh; } }

  .run-card {
    position: relative; cursor: pointer; padding: .7rem .8rem .7rem 1rem; border-radius: var(--radius-sm);
    border: 1px solid transparent; background: rgba(255,255,255,.02);
    display: grid; gap: .3rem; transition: background .15s ease, transform .15s ease, border-color .15s ease;
    animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .run-card::before {
    content: ""; position: absolute; left: 0; top: .35rem; bottom: .35rem; width: 3px; border-radius: 3px;
    background: var(--sev); opacity: .8;
  }
  .run-card:hover { background: var(--surface-hover); transform: translateX(1px); }
  .run-card.selected { background: rgba(99,102,241,.10); border-color: rgba(99,102,241,.35); }
  .run-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .run-card time { font-family: var(--mono); font-size: .74rem; color: var(--muted); }
  .run-card .summary { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .run-card .meta { display: flex; gap: .6rem; font-size: .72rem; color: var(--muted-2); font-family: var(--mono); }
  .run-card .meta .bad { color: var(--critical); }

  .pill { display: inline-flex; align-items: center; gap: .35rem; padding: .18rem .55rem; border-radius: 999px; font-size: .7rem; font-weight: 600; letter-spacing: .01em; text-transform: uppercase; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.info { color: var(--info); background: rgba(59,130,246,.14); }
  .pill.warning { color: var(--warning); background: rgba(245,158,11,.14); }
  .pill.critical { color: var(--critical); background: rgba(244,63,94,.14); }
  .pill.ok { color: var(--ok); background: rgba(16,185,129,.14); }

  .detail { position: sticky; top: 5.2rem; padding: 1.4rem 1.5rem 1.6rem; min-height: 300px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; padding: 4rem 1rem; color: var(--muted-2); text-align: center; }
  .empty svg { opacity: .5; }

  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .detail-head h2 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  .detail-head time { display: block; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-top: .25rem; }

  .summary-box {
    background: linear-gradient(180deg, rgba(99,102,241,.08), rgba(34,211,238,.04));
    border: 1px solid var(--border); border-left: 3px solid var(--accent1);
    border-radius: var(--radius-sm); padding: .9rem 1.05rem; white-space: pre-wrap; font-size: .88rem; color: #d7dae4;
    margin-bottom: 1.4rem;
  }

  h3.section { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 .6rem; font-weight: 600; }

  table.findings { border-collapse: collapse; width: 100%; margin-bottom: 1.4rem; }
  table.findings th { text-align: left; font-size: .72rem; font-weight: 500; color: var(--muted-2); padding: 0 .6rem .4rem; }
  table.findings td { padding: .5rem .6rem; border-top: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
  table.findings tr:hover td { background: rgba(255,255,255,.02); }
  .chips { display: flex; flex-wrap: wrap; gap: .3rem; }
  .chip { font-family: var(--mono); font-size: .7rem; color: var(--muted); background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 6px; padding: .05rem .4rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; margin-bottom: 1.4rem; }
  .stat-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .6rem .7rem; background: rgba(255,255,255,.02); }
  .stat-card .name { font-size: .8rem; font-weight: 600; margin-bottom: .3rem; display: flex; align-items: center; gap: .4rem; }
  .stat-card .icon { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .stat-card .icon.ok { background: var(--ok); box-shadow: 0 0 8px rgba(16,185,129,.6); }
  .stat-card .icon.fail { background: var(--critical); box-shadow: 0 0 8px rgba(244,63,94,.6); }
  .stat-card .sub { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .stat-card .err { font-size: .72rem; color: var(--critical); margin-top: .25rem; word-break: break-word; }

  .llm-bar { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .llm-bar .item { flex: 1 1 120px; padding: .65rem .85rem; border-right: 1px solid var(--border); }
  .llm-bar .item:last-child { border-right: none; }
  .llm-bar .item .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-2); margin-bottom: .2rem; }
  .llm-bar .item .v { font-family: var(--mono); font-size: .85rem; }
  .llm-bar .item .v.fail { color: var(--critical); }
  .llm-bar .item .v.disabled { color: var(--muted-2); }

  @media (prefers-reduced-motion: reduce) {
    .dot, .run-card { animation: none !important; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>digestron</h1>
    <span class="tag">run history</span>
  </div>
  <div class="status"><span class="dot"></span><span id="live-text">live</span></div>
</header>

<main class="app">
  <section class="panel">
    <div class="sidebar-head">
      <div class="totals">
        <div class="count" id="run-count">0<small>runs kept</small></div>
        <div class="tokens" id="token-total">0 tokens</div>
      </div>
      <svg class="spark" id="spark" viewBox="0 0 100 28" preserveAspectRatio="none"></svg>
    </div>
    <div id="runs" class="run-list"></div>
  </section>

  <section class="panel detail" id="detail">
    <div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M4 5h16M4 12h16M4 19h10" stroke-linecap="round"/>
      </svg>
      <div>select a run to inspect its digest</div>
    </div>
  </section>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sevColor = v => ({info: "var(--info)", warning: "var(--warning)", critical: "var(--critical)"}[v] || "var(--ok)");
const pill = v => `<span class="pill ${esc(v)}">${esc(v)}</span>`;
const ms = n => n >= 1000 ? (n / 1000).toFixed(1) + "s" : Math.round(n) + "ms";
const nsToMs = n => Math.round((n || 0) / 1e6);
const fmtTime = d => new Date(d).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
let selected = null;
let lastRuns = [];

function sparkline(points) {
  if (points.length < 2) return "";
  const max = Math.max(...points, 1);
  const min = Math.min(...points, 0);
  const span = Math.max(max - min, 1);
  const step = 100 / (points.length - 1);
  const coords = points.map((p, i) => `${(i * step).toFixed(1)},${(26 - ((p - min) / span) * 24).toFixed(1)}`);
  const line = coords.join(" ");
  const area = `0,28 ${line} 100,28`;
  return `
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderCard(r) {
  const model = r.model ? `<span>${esc(r.model)}</span>` : "";
  const tok = (r.prompt_tokens || r.completion_tokens) ? `<span>${r.prompt_tokens || 0}/${r.completion_tokens || 0}tok</span>` : "";
  const fails = [];
  if (r.sources_failed) fails.push(`<span class="bad">${r.sources_failed} src fail</span>`);
  if (r.sinks_failed) fails.push(`<span class="bad">${r.sinks_failed} sink fail</span>`);
  return `
    <div class="run-card ${r.id === selected ? "selected" : ""}" style="--sev:${sevColor(r.verdict)}" data-id="${esc(r.id)}">
      <div class="row1">${pill(r.verdict)}<time>${fmtTime(r.generated_at)}</time></div>
      <div class="summary">${esc((r.summary || "no summary").slice(0, 140))}</div>
      <div class="meta">${model}${tok}<span>${r.findings} findings</span>${fails.join("")}</div>
    </div>`;
}

async function refresh() {
  const runs = await (await fetch("api/runs")).json();
  lastRuns = runs;

  document.getElementById("runs").innerHTML =
    runs.map(renderCard).join("") ||
    `<div class="empty"><div>no runs yet — waiting for the first digest</div></div>`;

  document.getElementById("run-count").innerHTML = `${runs.length}<small>runs kept</small>`;
  const tokens = runs.reduce((a, r) => a + (r.prompt_tokens || 0) + (r.completion_tokens || 0), 0);
  document.getElementById("token-total").textContent = `${tokens.toLocaleString()} tokens`;

  const series = [...runs].reverse().map(r => (r.prompt_tokens || 0) + (r.completion_tokens || 0));
  document.getElementById("spark").innerHTML = sparkline(series);

  document.querySelectorAll(".run-card[data-id]").forEach(el =>
    el.addEventListener("click", () => show(el.dataset.id)));
}

async function show(id) {
  selected = id;
  document.querySelectorAll(".run-card[data-id]").forEach(el =>
    el.classList.toggle("selected", el.dataset.id === id));

  const resp = await fetch("api/runs/" + encodeURIComponent(id));
  if (!resp.ok) return;
  const { report: r } = await resp.json();

  const findingsRows = (r.findings || []).map(f => `
    <tr>
      <td>${pill(f.severity)}</td>
      <td class="mono" style="color:var(--muted)">${esc(f.source)}</td>
      <td>${esc(f.title)}</td>
      <td>${f.count}</td>
      <td><div class="chips">${Object.entries(f.details || {}).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `<span class="chip">${esc(k)}=${v}</span>`).join("") || "—"}</div></td>
    </tr>`).join("") || `<tr><td colspan="5" style="color:var(--muted-2)">none</td></tr>`;

  const sourceCards = (r.stats || []).map(s => `
    <div class="stat-card">
      <div class="name"><span class="icon ${s.error ? "fail" : "ok"}"></span>${esc(s.source)}</div>
      <div class="sub">${s.findings ?? 0} findings · ${ms(nsToMs(s.duration))}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("") || `<div style="color:var(--muted-2);font-size:.8rem">none</div>`;

  const sinkCards = (r.sinks || []).map(s => `
    <div class="stat-card">
      <div class="name"><span class="icon ${s.error ? "fail" : "ok"}"></span>${esc(s.sink)}</div>
      <div class="sub">${ms(nsToMs(s.duration))}</div>
      ${s.error ? `<div class="err">${esc(s.error)}</div>` : ""}
    </div>`).join("") || `<div style="color:var(--muted-2);font-size:.8rem">none</div>`;

  const l = r.llm || {};
  const llmBar = l.provider ? `
    <div class="item"><div class="k">provider</div><div class="v">${esc(l.provider)}</div></div>
    <div class="item"><div class="k">model</div><div class="v">${esc(l.model || "—")}</div></div>
    <div class="item"><div class="k">prompt tok</div><div class="v">${l.prompt_tokens || 0}</div></div>
    <div class="item"><div class="k">completion tok</div><div class="v">${l.completion_tokens || 0}</div></div>
    <div class="item"><div class="k">duration</div><div class="v">${ms(nsToMs(l.duration))}</div></div>
    <div class="item"><div class="k">status</div><div class="v ${l.error ? "fail" : ""}">${esc(l.error || "ok")}</div></div>`
    : `<div class="item"><div class="k">llm</div><div class="v disabled">disabled for this run</div></div>`;

  document.getElementById("detail").innerHTML = `
    <div class="detail-head">
      <div>
        <h2>${esc(r.title)}</h2>
        <time>${fmtTime(r.generated_at)}</time>
      </div>
      ${pill(r.verdict)}
    </div>
    <div class="summary-box">${esc(r.summary || "(no LLM summary — raw digest was delivered)")}</div>

    <h3 class="section">findings received</h3>
    <table class="findings">
      <thead><tr><th>severity</th><th>source</th><th>finding</th><th>count</th><th>breakdown</th></tr></thead>
      <tbody>${findingsRows}</tbody>
    </table>

    <h3 class="section">sources</h3>
    <div class="stat-grid">${sourceCards}</div>

    <h3 class="section">sinks sent</h3>
    <div class="stat-grid">${sinkCards}</div>

    <h3 class="section">llm</h3>
    <div class="llm-bar">${llmBar}</div>
  `;
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
