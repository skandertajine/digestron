name: deploy-dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "deploy/dev/deployment.yaml"

permissions:
  contents: write
  packages: write

# One deploy at a time. A newer push cancels the run it supersedes, so the
# manifest always ends on the newest commit instead of on whichever build
# finished last.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # The commit ci just passed, which is also the one the tag names. dev
      # may already point further.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - id: tag
        run: echo "sha=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.sha }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}

      - name: bump dev manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.tag.outputs.sha }}
        run: |
          # Commit the bump on top of the current dev tip: a [skip ci] commit
          # may have landed since this run started, and pushing from the
          # built commit would then be rejected.
          git fetch --depth=1 origin dev
          git checkout -q --detach FETCH_HEAD
          sed -i "s|${IMAGE}:dev.*|${IMAGE}:${TAG}|" deploy/dev/deployment.yaml
          if git diff --quiet; then
            echo "deploy/dev/deployment.yaml already on ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/dev/deployment.yaml
          git commit -m "deploy: ${TAG} [skip ci]"
          git push origin HEAD:dev
