apiVersion: v1
kind: ConfigMap
metadata:
  name: digestron-config
data:
  config.yaml: |
    digest:
      title: "Security digest [dev]"
      window: 1h
      language: fr
      # top IP investiguees (facettes ES + rDNS/RDAP) et analysees par le LLM
      top_actors: 5
      context: >
        Homelab k3s deux noeuds expose sur Internet via un edge nginx sur un
        Raspberry Pi : Home Assistant, Immich, Vaultwarden, ArgoCD, Grafana.
        fail2ban protege l'edge, UFW le serveur principal.

    schedule:
      cron: "5 * * * *"
      timezone: "Europe/Paris"

    metrics:
      listen: ":9090"

    history:
      path: /data/history.json
      keep: 200

    sources:
      - name: es-security
        type: elasticsearch
        settings:
          url: http://elasticsearch.elasticsearch.svc.cluster.local:9200
          index: "filebeat-*"
          username: elastic
          password: ${ES_PASSWORD}
          queries:
            - preset: fail2ban
            - preset: ssh_auth
            - preset: app_login_failures
            - preset: ufw_blocks
            - preset: nginx_public

    llm:
      type: ollama
      timeout: 300s
      settings:
        url: http://192.168.0.156:9401
        model: qwen3.5:9b
        num_ctx: 16384
        keep_alive: -1m
        # echantillonnage pour un rapport factuel et rejouable, au lieu des
        # valeurs "chat" du modelfile (audit du 10/10 : temperature 1,
        # presence_penalty 1.5) ; top_p reste celui du modelfile
        temperature: 0.2
        presence_penalty: 0
        seed: 42

    sinks:
      - name: phone
        type: homeassistant
        settings:
          url: http://home-assistant.home-assistant.svc.cluster.local:8123
          token: ${HA_TOKEN}
          service: mobile_app_iphone
          # notif courte (titre + une ligne par IP), le tap ouvre le rapport complet
          link: http://digestron-dev.home/
          max_chars: 450
