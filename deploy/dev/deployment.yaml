# Homelab dev environment. Image tag is bumped automatically by
# .github/workflows/deploy-dev.yml on every push to the dev branch —
# don't edit the tag by hand, it gets overwritten.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: digestron
spec:
  replicas: 1
  # The history volume is ReadWriteOnce and two schedulers must never run the
  # same hour: stop the old pod before starting the new one. The explicit null
  # drops the rollingUpdate block the API server defaulted, which a
  # client-side apply (ArgoCD) would otherwise keep and get rejected for.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: digestron
  template:
    metadata:
      labels:
        app: digestron
      annotations:
        prometheus.io/scrape: "true"
    spec:
      securityContext:
        # The image runs as 65532 (distroless nonroot); local-path creates the
        # volume 0777, fsGroup covers provisioners that do not.
        fsGroup: 65532
      containers:
        - name: digestron
          image: ghcr.io/skandertajine/digestron:dev-0f8c40b
          args: ["serve", "-config", "/etc/digestron/config.yaml"]
          ports:
            - containerPort: 9090
              name: http
          env:
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: elastic-password
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ha-notify-token
                  key: token
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/digestron
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 32Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: digestron-config
        - name: data
          persistentVolumeClaim:
            claimName: digestron-data
---
apiVersion: v1
kind: Service
metadata:
  name: digestron
  labels:
    app: digestron
spec:
  selector:
    app: digestron
  ports:
    - name: http
      port: 9090
      targetPort: http
